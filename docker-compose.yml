services:
  postgres:
    image: postgres:16-alpine
    container_name: quickmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickmart
      POSTGRES_PASSWORD: quickmart
      POSTGRES_DB: quickmart_inventory
    ports:
      - "5432:5432"
    volumes:
      - quickmart_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickmart -d quickmart_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quickmart_pg_data:
